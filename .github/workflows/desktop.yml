name: Desktop MVP
on:
  pull_request:
    paths:
      - "desktop/**"
      - "desktop-sync*.mjs"
      - "history.html"
      - "manifest.json"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - "feat/desktop-v0.4-mvp"
    paths:
      - "desktop/**"
      - "desktop-sync*.mjs"
      - "history.html"
      - "manifest.json"
      - ".github/workflows/desktop.yml"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Chrome Native Messaging host
        run: ./desktop/native/register-chrome.ps1 -ExtensionId aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -BuildOnly
      - name: Run extension regression tests
        run: node --test *.test.mjs
      - name: Run unit tests
        working-directory: desktop
        run: npm test
      - name: Build renderer
        working-directory: desktop
        run: npm run build
