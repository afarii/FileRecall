appId: com.filerecall.desktop
productName: FileRecall
publish:
  provider: generic
  url: https://github.com/afarii/FileRecall/releases/download/desktop-preview/
directories:
  output: release
files:
  - dist/**
  - electron/*.cjs
  - electron/tray-icon.ico
  - "!electron/*.test.cjs"
  - "!electron/launch.cjs"
  - "!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
  - "!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**"
asarUnpack:
  - "**/onnxruntime-node/bin/**"
npmRebuild: false
extraResources:
  - from: .package-host
    to: native
    filter:
      - filerecall-host.exe
      - filerecall-ntfs.exe
  - from: electron
    to: electron
    filter:
      - native-host.cjs
      - download-sources.cjs
win:
  executableName: FileRecall
  electronLanguages:
    - zh-CN
    - en-US
nsis:
  artifactName: FileRecall-Setup-${version}-${arch}.${ext}
  oneClick: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: true
  include: native/installer.nsh
